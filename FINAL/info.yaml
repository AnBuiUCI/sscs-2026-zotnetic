# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Magnetic Gradient Navigation and Control IC"
  team: "B26 Zotnetic"
  discord: "teareverie"                   # Optional: Discord username (for support / communication)
  description: "Four magnetoresistive bridges resolve the gradient of the field magnitude"
  lvs_config: "lvs_config.json"

# ======================================================
# Pin definitions
# ======================================================
#
# Top cell: B26_A -- the padring's user area, with GRADIENT_NAV2 inside it
# GDS:      FINAL/openroad/out_integration/B26_A_filled3.gds
#           (also reached through lvs_config.json -> LAYOUT_FILE)
#
#           THE NUMBER IS THE VERSION, NOT ANOTHER CHIP. All three of
#           B26_A_filled.gds, _filled2 and _filled3 are byte-identical today
#           -- sha256 95ebcf92d8d36680... -- and carry the comb-shaped pin
#           escapes: the original solid 55.7 x 44.3 um Metal2 plate over each
#           analogue pad was eleven MSLOT.1 violations, metal wider than 30 um
#           in both directions without slotting. The flow still writes
#           B26_A_filled.gds as its own output; the submission reads the
#           numbered one so that a stale copy can never be picked up by
#           mistake.
#
#           _filled3 is the pointer re-verified on 2026-09-01 on a 31 GB
#           machine, and its evidence is filed under its own name:
#           sign-off DRC (main/deep, the only mode where the PDK's mslot table
#           does not crash) 660 rule categories and 0 items, MSLOT.1 among
#           them so the rule really ran; split-table DRC 63 tables 0 items;
#           netgen Circuits match uniquely; 17/17 pins conduct; one PR_bndry.
#           Archived under integration/gds/.
#
#           The secondary ESD is ESD_CDM, our layout of the organisers' exact
#           schematic (8 diodes 10x10, ppolyf_u W=16 L=4, 87.5 ohm), eleven
#           instances by the pads. Their io_secondary_5p0 is kept in the tree
#           but not instantiated: all three of its variants carry MSLOT.1.
#
# The block on its own is still built and checked as GRADIENT_NAV2
# (FINAL/openroad/out_v2_GRADIENT_NAV2/), but what is submitted is the
# integrated area: our macro, the routing out to the 73 pins of the ring and
# the tie-offs that program the six digital pads. The LVS reference is
# verilog/B26_A.v, which carries that programming, plus the block's own
# GRADIENT_NAV2_lvs.spice.
#
# ORDER. The padring assigns one slot per entry, in this order, so the list is
# the pad map. Two rules from resources/info.yaml of the chipathon repo:
#
#   * the FIRST pin must be a ground connection  -> VSS opens the list;
#   * a power/ground cell breaks the I/O power rails, so the supplies go at the
#     two ENDS, where the project boundary already breaks them -> VDD closes it.
#
# The seventeen signal pins keep the relative order they had in the padring the
# organisers generated on 23 August (B26_A_pad_map.yaml), so that moving the two
# supplies is the ONLY change they have to re-run.
#
# TYPES. The nine outputs are not all of a kind:
#
#   * XP XN YP YN ZP ZN are DIGITAL. They come out of the inverter behind the
#     decision comparator and swing rail to rail, so they take a digital pad.
#     Declared `bidirectional`; `secondary_esd` does not apply to them.
#   * X Y Z are genuinely ANALOGUE: each is the weight block's vote counter, and
#     it lives between 1.814 V (three chains voting) and 3.035 V (none).
#   * S1P..S4N are the eight bridge nodes.
#
# That is 11 analogue + 6 digital + 2 supplies = 19, which is the split the
# proposal already announced: "11 Analog Pads (8 inputs, 3 test points),
# 7 Digital Pads (6 outputs, 1 input)".
#
# ONE THING TO CONFIRM WITH THE ORGANISERS: a bidirectional pad has an
# output-enable and this block has no such port. These six are permanent
# outputs, so the enable should be tied to "always driving".
#
# SECONDARY ESD. The analogue pads carry HBM diodes only (gf180mcu_fd_io 4.5),
# so a CDM network -- series poly resistor plus diodes -- sits on each analogue
# pin. It lives in the USER AREA next to the pad it protects, NOT inside
# GRADIENT_NAV2: the path pad -> clamp -> gate is what the clamp is for, and
# whatever sits between the pad and the clamp is unprotected.
#
# The cell is ESD_CDM (openroad/scripts/esd_layout.py), which is the
# organisers' circuit drawn by us, device for device, from their
# io_secondary_5p0.sch:
#
#     D1 diode_pd2nw_06v0  r_w=10u r_l=10u m=4     ->  4 instances, A=100p P=40u
#     D2 diode_nd2ps_06v0  r_w=10u r_l=10u m=4     ->  4 instances, A=100p P=40u
#     R1 ppolyf_u  W=16e-6 L=4e-6                  ->  87.5 ohm, bulk on VDD
#
# `m=4` is written as four instances because KLayout does not expand it, and the
# resistor's bulk is VDD -- the `B` pin of their symbol -- so its body sits over
# an n-well with its own n+ tap.
#
# WHY OURS AND NOT THEIRS, having adopted theirs first: all THREE cells they
# publish violate MSLOT.1 -- secondary_ESD on Metal1 and Metal2, secondary_ESD_m2
# on Metal2, secondary_ESD_m3 on Metal3 -- and nobody had seen it because the
# PDK's `mslot` table crashes before it gets there. Ours has none, and is
# 1,762 um2 against their 6,457: about 52,000 um2 of user area back over the
# eleven instances. Their cell stays in the tree, uninstantiated, with its
# provenance note in layouts_v2/io_secondary_5p0/README_ORIGEN.txt.
#
# Also worth their attention: their own schematic does not describe their own
# GDS (it declares the resistor 16 x 4 um where the layout draws it 40 x 10 --
# same 0.25 squares, same 87.5 ohm, different geometry), and the top cell of
# secondary_ESD_m3 is called `io_secondary_5p0$1$2`, whose `$` characters break
# the DRC deck when passed on a command line.
#
# WHAT THE SIGNALS MEAN. Each sensor reads the MAGNITUDE of the field, |B|, at
# its position. The four of them sample that scalar field at the vertices of a
# tetrahedron, and the chip reconstructs grad|B| -- which points towards where
# the magnitude grows, i.e. towards the source.

pins:
  # --- ground opens the list ---------------------------------------------------
  - name: VSS            # block ground
    io_type: ground

  # --- the seventeen signal pins, in the order the padring already uses --------
  - name: S4P            # sensor 4, positive leg of the bridge
    io_type: analog
    secondary_esd: true
  - name: S4N            # sensor 4, negative leg
    io_type: analog
    secondary_esd: true
  - name: Z              # Z vote counter, analogue test point
    io_type: analog
    secondary_esd: true
  - name: ZN             # Z decision, negated
    io_type: bidirectional
  - name: ZP             # Z decision
    io_type: bidirectional
  - name: Y
    io_type: analog
    secondary_esd: true
  - name: YN
    io_type: bidirectional
  - name: YP
    io_type: bidirectional
  - name: X
    io_type: analog
    secondary_esd: true
  - name: XN
    io_type: bidirectional
  - name: XP
    io_type: bidirectional
  - name: S1N            # sensor 1, negative leg
    io_type: analog
    secondary_esd: true
  - name: S1P
    io_type: analog
    secondary_esd: true
  - name: S3P            # sensor 3
    io_type: analog
    secondary_esd: true
  - name: S3N
    io_type: analog
    secondary_esd: true
  - name: S2N            # sensor 2
    io_type: analog
    secondary_esd: true
  - name: S2P
    io_type: analog
    secondary_esd: true

  # --- and power closes it -----------------------------------------------------
  - name: VDD            # 6 V supply
    io_type: power
