# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Magnetic Gradient Navigation and Control IC"
  team: "B26 Zotnetic"
  discord: "teareverie"                   # Optional: Discord username (for support / communication)
  description: "Four magnetoresistive bridges resolve the gradient of the field magnitude"
  lvs_config: "lvs_config.json"

# ======================================================
# Pin definitions
# ======================================================
#
# Top cell: B26_A -- the padring's user area, with GRADIENT_NAV2 inside it
# GDS:      FINAL/openroad/out_integration/B26_A_filled.gds
#           (also reached through lvs_config.json -> LAYOUT_FILE)
#
# The block on its own is still built and checked as GRADIENT_NAV2
# (FINAL/openroad/out_v2_GRADIENT_NAV2/), but what is submitted is the
# integrated area: our macro, the routing out to the 73 pins of the ring and
# the tie-offs that program the six digital pads. The LVS reference is
# verilog/B26_A.v, which carries that programming, plus the block's own
# GRADIENT_NAV2_lvs.spice.
#
# ORDER. The padring assigns one slot per entry, in this order, so the list is
# the pad map. Two rules from resources/info.yaml of the chipathon repo:
#
#   * the FIRST pin must be a ground connection  -> VSS opens the list;
#   * a power/ground cell breaks the I/O power rails, so the supplies go at the
#     two ENDS, where the project boundary already breaks them -> VDD closes it.
#
# The seventeen signal pins keep the relative order they had in the padring the
# organisers generated on 23 August (B26_A_pad_map.yaml), so that moving the two
# supplies is the ONLY change they have to re-run.
#
# TYPES. The nine outputs are not all of a kind:
#
#   * XP XN YP YN ZP ZN are DIGITAL. They come out of the inverter behind the
#     decision comparator and swing rail to rail, so they take a digital pad.
#     Declared `bidirectional`; `secondary_esd` does not apply to them.
#   * X Y Z are genuinely ANALOGUE: each is the weight block's vote counter, and
#     it lives between 1.814 V (three chains voting) and 3.035 V (none).
#   * S1P..S4N are the eight bridge nodes.
#
# That is 11 analogue + 6 digital + 2 supplies = 19, which is the split the
# proposal already announced: "11 Analog Pads (8 inputs, 3 test points),
# 7 Digital Pads (6 outputs, 1 input)".
#
# ONE THING TO CONFIRM WITH THE ORGANISERS: a bidirectional pad has an
# output-enable and this block has no such port. These six are permanent
# outputs, so the enable should be tied to "always driving".
#
# SECONDARY ESD. The analogue pads carry HBM diodes only (gf180mcu_fd_io 4.5),
# so the CDM network -- series poly resistor plus the two diodes -- is inside
# the block, next to the protected gates, one per analogue pin.
#
# WHAT THE SIGNALS MEAN. Each sensor reads the MAGNITUDE of the field, |B|, at
# its position. The four of them sample that scalar field at the vertices of a
# tetrahedron, and the chip reconstructs grad|B| -- which points towards where
# the magnitude grows, i.e. towards the source.

pins:
  # --- ground opens the list ---------------------------------------------------
  - name: VSS            # block ground
    io_type: ground

  # --- the seventeen signal pins, in the order the padring already uses --------
  - name: S4P            # sensor 4, positive leg of the bridge
    io_type: analog
    secondary_esd: true
  - name: S4N            # sensor 4, negative leg
    io_type: analog
    secondary_esd: true
  - name: Z              # Z vote counter, analogue test point
    io_type: analog
    secondary_esd: true
  - name: ZN             # Z decision, negated
    io_type: bidirectional
  - name: ZP             # Z decision
    io_type: bidirectional
  - name: Y
    io_type: analog
    secondary_esd: true
  - name: YN
    io_type: bidirectional
  - name: YP
    io_type: bidirectional
  - name: X
    io_type: analog
    secondary_esd: true
  - name: XN
    io_type: bidirectional
  - name: XP
    io_type: bidirectional
  - name: S1N            # sensor 1, negative leg
    io_type: analog
    secondary_esd: true
  - name: S1P
    io_type: analog
    secondary_esd: true
  - name: S3P            # sensor 3
    io_type: analog
    secondary_esd: true
  - name: S3N
    io_type: analog
    secondary_esd: true
  - name: S2N            # sensor 2
    io_type: analog
    secondary_esd: true
  - name: S2P
    io_type: analog
    secondary_esd: true

  # --- and power closes it -----------------------------------------------------
  - name: VDD            # 6 V supply
    io_type: power
